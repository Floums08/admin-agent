# Always merge AFTER compose.yaml. Requires Docker Compose >= 2.24.4.
# !override replaces the public production ports; ordinary list merging is unsafe here.
services:
  app:
    environment:
      ADMIN_AGENT_PUBLIC_ORIGIN: https://pilot.localhost:${PILOT_PORT:?}
  proxy:
    ports: !override
      - target: 443
        published: "${PILOT_PORT:?}"
        host_ip: 127.0.0.1
        protocol: tcp
    # Docker needs a normal bridge for the loopback-published port. Only the
    # proxy joins edge; the app and OCR worker keep their internal-only networks.
    networks: !override [private, edge]
    volumes:
      - ./deploy/Caddyfile.pilot:/etc/caddy/Caddyfile:ro
