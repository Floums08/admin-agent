name: Production and local QA
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.11', '3.12', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install --requirement requirements-production.txt --requirement requirements-ocr.txt
      - name: Install local OCR engines and language models
        run: sudo apt-get update && sudo apt-get install --yes poppler-utils tesseract-ocr tesseract-ocr-fra tesseract-ocr-spa tesseract-ocr-eng util-linux
      - name: Run deterministic checks and regression tests
        run: python scripts/qa.py
  ui:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: python -m pip install --requirement requirements-production.txt --requirement requirements-ocr.txt
      - name: Install local OCR engines and language models
        run: sudo apt-get update && sudo apt-get install --yes poppler-utils tesseract-ocr tesseract-ocr-fra tesseract-ocr-spa tesseract-ocr-eng util-linux
      - name: Run DOM and real local API scenarios
        run: npm run test:ui
      - name: Run authentication and permission DOM scenarios
        run: npm run test:auth-ui
      - name: Run document review DOM scenarios
        run: npm run test:documents-ui
      - name: Run invoice tracking and bank reconciliation DOM scenarios
        run: npm run test:finance-ui
      - run: npx playwright install --with-deps chromium
      - name: Run desktop and mobile browser scenarios with local TLS
        run: npm run test:browser
      - name: Run original document and OCR browser scenarios
        run: npm run test:documents-browser
      - name: Run finance and receipt browser scenarios
        run: npm run test:finance-browser
  production-image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --requirement requirements-production.txt --requirement requirements-ocr.txt
      - name: Check operations shell scripts
        run: bash -n deploy/backup.sh deploy/restore-drill.sh
      - name: Validate isolated-client Compose configuration
        run: |
          python -m admin_agent.ops init-client --client-id ci-demo --domain admin-ci.example.test --directory /tmp/admin-agent-compose-client
          docker compose --env-file /tmp/admin-agent-compose-client/client.env config --quiet
      - name: Build exact production image
        run: docker build --tag admin-agent:ci .
      - name: Build isolated OCR image
        run: docker build --file Dockerfile.ocr --tag admin-agent-ocr:ci .
      - name: Run real images, OCR and authentication smoke
        run: python scripts/container_smoke.py --image admin-agent:ci --ocr-image admin-agent-ocr:ci
      - name: Validate the TLS proxy configuration
        run: docker compose --env-file /tmp/admin-agent-compose-client/client.env run --rm --no-deps proxy caddy validate --config /etc/caddy/Caddyfile --adapter caddyfile
      - name: Rehearse the private invoice pilot with verified local TLS
        run: python scripts/pilot_smoke.py --image admin-agent:ci --ocr-image admin-agent-ocr:ci
      - name: Install restoration test dependency
        run: sudo apt-get update && sudo apt-get install --yes restic
      - name: Exercise encrypted snapshot restoration with synthetic data
        run: PYTHON=python RESTIC_BINARY=restic sh tests/restic_smoke.sh
  dependencies:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install pip-audit==2.10.1
      - name: Audit pinned Python production dependencies
        run: python -m pip_audit --requirement requirements-production.txt --strict
      - name: Audit pinned OCR dependencies
        run: python -m pip_audit --requirement requirements-ocr.txt --strict
